# deepin-gomoku —— Android APK 自动构建
#
# 触发时机：
#   - push / PR 修改 android/ 目录或本工作流文件时
#   - 手动触发（Actions 页面 → Run workflow）
#
# 构建产物：arm64-v8a 的 debug APK，作为 Actions artifact 上传，可直接下载安装。

name: Build Android APK

on:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build deepin-gomoku APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "ndk;26.1.10909125" \
            "platforms;android-33" \
            "build-tools;33.0.1"
          # 供 CMake / androiddeployqt 定位 NDK
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia'
          dir: '${{ runner.temp }}'
          cache: 'true'

      - name: Configure (CMake)
        run: |
          qt-cmake -S android -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      - name: Build APK
        run: cmake --build build --target apk --parallel 4

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepin-gomoku-android-arm64
          path: build/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
