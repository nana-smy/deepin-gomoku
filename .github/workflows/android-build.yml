# deepin-gomoku —— Android APK 自动构建、签名与发布
#
# 触发时机：
#   - push / PR 修改 android/ 目录或本工作流文件时
#   - 推送 v* 标签时（发布对应版本）
#   - 手动触发（Actions 页面 → Run workflow）
#
# 产物：arm64-v8a 的 release APK，构建后用 apksigner 签名。
#   - 每次构建作为 Actions artifact 上传；
#   - 推送到 master 后自动发布到 Releases（tag android-latest，每次覆盖）；
#   - 推送 v* 标签时发布对应版本的 Release。

name: Build Android APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build deepin-gomoku APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 使用 GitHub runner 自带的 Android SDK；不再用 setup-android
      # （其内部执行 sdkmanager tools，在新 cmdline-tools 下该包已不可用而报错）。
      # 显式定位 sdkmanager，安装所需 NDK / 平台 / 构建工具。
      - name: Install Android NDK & platform
        run: |
          SDK_MANAGER=""
          for d in "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin; do
            [ -x "$d/sdkmanager" ] && SDK_MANAGER="$d/sdkmanager" && break
          done
          [ -z "$SDK_MANAGER" ] && SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" --install "ndk;26.1.10909125" "platforms;android-33" "build-tools;33.0.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtmultimedia'
          dir: '${{ runner.temp }}'
          cache: 'true'

      # 启动图标由仓库自带的 SVG 光栅化生成（PNG 无法以文本提交）
      - name: Install SVG rasterizer
        run: |
          if command -v rsvg-convert >/dev/null 2>&1; then
            echo "rsvg-convert already available"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          fi

      - name: Generate launcher icons
        run: python3 android/tools/make_launcher_icons.py

      # 界面素材：优先用 PySide6 的 QSvgRenderer（与桌面版同一条渲染路径）把桌面 SVG
      # 光栅化为 PNG；安装失败时脚本会退回 resvg/librsvg，不会中断构建。
      - name: Install SVG rendering deps
        run: |
          pip install --quiet "PySide6-Essentials==6.8.3" || echo "PySide6 unavailable, fallback to resvg"
          pip install --quiet resvg-py || true

      - name: Generate UI assets
        run: python3 android/tools/make_ui_assets.py

      - name: Configure (CMake)
        run: |
          qt-cmake -S android -B build -DCMAKE_BUILD_TYPE=Release -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      - name: Build APK
        run: cmake --build build --target apk --parallel 4

      # Qt/gradle 产出的是未签名包，这里用仓库内固定密钥签名，保证各版本签名一致、可覆盖升级
      - name: Sign APK (zipalign + apksigner)
        run: |
          set -e
          BT="$ANDROID_SDK_ROOT/build-tools/33.0.1"
          mkdir -p dist
          base64 -d android/signing/deepin-gomoku.keystore.b64 > "$RUNNER_TEMP/release.keystore"
          UNSIGNED=$(find build/android-build -path '*release*' -name '*.apk' | head -1)
          if [ -z "$UNSIGNED" ]; then UNSIGNED=$(find build/android-build -name '*.apk' | head -1); fi
          if [ -z "$UNSIGNED" ]; then echo "::error::APK not found"; exit 1; fi
          echo "unsigned apk: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass pass:gomoku-signing-2024 --key-pass pass:gomoku-signing-2024 --out dist/deepin-gomoku-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs dist/deepin-gomoku-signed.apk
          ls -l dist

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepin-gomoku-android-arm64
          path: dist/*.apk
          if-no-files-found: error

  # 自动发布：构建成功后直接把 APK 传到 GitHub Releases
  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: deepin-gomoku-android-arm64
          path: dist

      - name: Prepare release files
        run: |
          VERSION=$(awk -F'"' '/android:versionName/ {print $2}' android/android/AndroidManifest.xml)
          cp dist/deepin-gomoku-signed.apk "dist/deepin-gomoku-${VERSION}-arm64.apk"
          rm -f dist/deepin-gomoku-signed.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist

      - name: Resolve release tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "TAG=android-latest" >> "$GITHUB_ENV"
          fi

      - name: Clean stale APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | while read -r name; do
            [ -z "$name" ] && continue
            case "$name" in
              deepin-gomoku-${VERSION}-arm64.apk) ;;
              *.apk) echo "removing stale asset: $name"; gh release delete-asset "$TAG" "$name" --yes || true ;;
            esac
          done

      - name: Move rolling tag to current commit
        run: |
          if [ "$TAG" != "android-latest" ]; then
            echo "tag push, keep the given tag"
            exit 0
          fi
          git tag -f android-latest "$GITHUB_SHA"
          git push -f origin refs/tags/android-latest

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: deepin-gomoku Android ${{ env.VERSION }}
          body: |
            deepin-gomoku 的 Android 移植版，由 GitHub Actions 自动构建发布。

            - 架构：arm64-v8a
            - 包名：org.deepin.gomoku
            - 最低系统：Android 9.0（API 28）
            - 版本：${{ env.VERSION }}
            - 签名：已签名（自签名证书），可直接安装

            安装：下载下方 APK 直接安装即可（允许安装未知来源应用）。
            每次 master 构建都会覆盖 android-latest 发布；推送 v* 标签则生成对应版本。
          files: dist/deepin-gomoku-${{ env.VERSION }}-arm64.apk
          prerelease: false
          make_latest: true
